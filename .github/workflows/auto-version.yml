name: Auto Update Version JSON

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.json'

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Generar nueva fecha y hora
        run: |
          FECHA_HORA=$(date +'%Y-%m-%d %H:%M')
          echo "{\"fecha_completa\": \"$FECHA_HORA\"}" > version.json

      - name: Subir a GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add version.json
          git commit -m "Actualización automática [skip ci]" || echo "Sin cambios"
          git push