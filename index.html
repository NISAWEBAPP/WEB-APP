<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#2E5A27">
        <title>Visor de Lotes y Fracciones</title>

        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Estilos Base OpenLayers y Plugins -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" type="text/css" href="resources/horsey.min.css">
        <link rel="stylesheet" type="text/css" href="resources/ol-search-layer.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
    </head>
    <body>
        <!-- Barra Superior Flotante: Logo + Buscador + Filtros Rápidos -->
        <header id="app-top-bar" class="app-top-bar">
            <div class="search-header-row">
                <div class="brand-badge" title="Inicio / Vista General" id="btn-reset-view">
                    <img src="images/logo.png" id="map-logo" alt="Logo" onerror="this.style.display='none'">
                </div>
                <div id="search-host" class="search-host"></div>
                <button id="btn-fraction-selector" class="fraction-selector-btn" title="Filtrar por Distrito / Ciudad y Lista de Fracciones" type="button">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Píldoras de Filtro Rápido: Botón Distrito/Ciudad + Estados de Lotes -->
            <div id="quick-filters-bar" class="quick-filters-bar">
                <!-- Se poblará dinámicamente desde qgis2web.js -->
            </div>
        </header>

        <!-- Barra Flotante de Fracción Activa (aparece al entrar a una fracción) -->
        <div id="active-fraction-banner" class="active-fraction-banner hidden">
            <div class="afb-info">
                <span class="afb-title" id="afb-title">Fracción</span>
                <span class="afb-meta" id="afb-meta">0 libres</span>
            </div>
            <div class="afb-actions">
                <button type="button" id="afb-btn-open-lots" class="afb-btn-lots">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                        <line x1="7" y1="8" x2="17" y2="8"></line>
                        <line x1="7" y1="12" x2="17" y2="12"></line>
                        <line x1="7" y1="16" x2="13" y2="16"></line>
                    </svg>
                    <span id="afb-btn-text">Ver lotes libres</span>
                </button>
                <button type="button" id="afb-btn-close" class="afb-btn-close" aria-label="Cerrar">&times;</button>
            </div>
        </div>

        <!-- Modal / Panel Desplegable de Selección por Distrito-Ciudad y Fracción -->
        <div id="fraction-drawer" class="fraction-drawer hidden">
            <div class="fraction-drawer-header">
                <div class="drawer-header-title">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>Fracciones por Distrito / Ciudad</span>
                </div>
                <button id="fraction-drawer-close" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <!-- Filtros de Distrito / Ciudad, Ordenamiento y Búsqueda -->
            <div class="fraction-drawer-filters">
                <div class="district-filter-group">
                    <label for="district-select">Distrito / Ciudad:</label>
                    <div class="district-select-row">
                        <select id="district-select" class="district-select">
                            <option value="ALL">Todos los Distritos / Ciudades</option>
                        </select>
                        <button id="btn-fit-district" class="btn-fit-district" type="button" title="Ver zona en el mapa">
                            Ver zona
                        </button>
                    </div>
                </div>
                <div class="fraction-search-sort-row">
                    <input type="text" id="fraction-filter-input" placeholder="Buscar fracción, código o ciudad...">
                    <select id="fraction-sort-select" class="fraction-sort-select" title="Ordenar fracciones">
                        <option value="CODE">Orden: Código</option>
                        <option value="FREE_DESC">Más libres</option>
                        <option value="PRICE_ASC">Cuota más baja</option>
                    </select>
                </div>
            </div>

            <div id="fraction-drawer-CountBar" class="fraction-drawer-countbar"></div>
            <div id="fraction-list-container" class="fraction-list-container"></div>
        </div>

        <!-- Modal / Panel de Listado Detallado de Lotes Libres de una Fracción -->
        <div id="free-lots-modal" class="free-lots-modal hidden">
            <div class="flm-header">
                <div class="flm-header-top">
                    <button type="button" id="flm-btn-back" class="flm-btn-back" title="Volver a Fracciones">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        <span>Fracciones</span>
                    </button>
                    <button type="button" id="flm-btn-close" class="flm-btn-close" aria-label="Cerrar">&times;</button>
                </div>
                <h3 id="flm-fraction-title" class="flm-fraction-title">Lotes Libres</h3>
                <p id="flm-fraction-subtitle" class="flm-fraction-subtitle"></p>
            </div>

            <div class="flm-controls">
                <div class="flm-filter-row">
                    <select id="flm-manzana-select" class="flm-select">
                        <option value="ALL">Todas las Manzanas</option>
                    </select>
                    <select id="flm-sort-select" class="flm-select">
                        <option value="MZ_LOTE">Orden: Manzana / Lote</option>
                        <option value="CUOTA_ASC">Cuota: Menor a Mayor</option>
                        <option value="CONTADO_ASC">Contado: Menor a Mayor</option>
                        <option value="SUP_DESC">Mayor Superficie</option>
                    </select>
                </div>
            </div>

            <div id="flm-summary-bar" class="flm-summary-bar"></div>
            <div id="flm-lots-list" class="flm-lots-list"></div>
        </div>

        <!-- Contenedor Principal del Mapa -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <div class="sheet-drag-handle" id="sheet-drag-handle"></div>
                <a href="#" id="popup-closer" class="ol-popup-closer" aria-label="Cerrar ficha"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Scripts de QGIS2Web y Capas -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="resources/horsey.min.js"></script>
        <script src="resources/ol-search-layer.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>

        <!-- Capas de Datos -->
        <script src="layers/FRACCION_0.js"></script>
        <script src="layers/Combinado_3.js"></script>
        <script src="layers/FRACCIONcopiar_4.js"></script>
        <script src="layers/fraccion_5.js"></script>
        <script src="layers/NOMBREFRACCION_6.js"></script>
        <script src="layers/MANZANAS_7.js"></script>

        <!-- Estilos de Capas -->
        <script src="styles/FRACCION_0_style.js"></script>
        <script src="styles/Combinado_3_style.js"></script>
        <script src="styles/FRACCIONcopiar_4_style.js"></script>
        <script src="styles/fraccion_5_style.js"></script>
        <script src="styles/NOMBREFRACCION_6_style.js"></script>
        <script src="styles/MANZANAS_7_style.js"></script>

        <!-- Inicialización de Capas y Lógica del Mapa -->
        <script src="./layers/layers.js" type="text/javascript"></script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <!-- Sistema de Actualización Automática (se mantiene intacto) -->
        <script src="updater.js" defer onerror="console.info('updater.js no detectado en raíz o cargado externamente.')"></script>
    </body>
</html>
